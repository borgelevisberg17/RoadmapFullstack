<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artigos - RoadmapFullstack</title>
    <link href="assets/style.css" rel="stylesheet"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">
            <i class='bx bx-map-alt'></i> RoadmapFullstack
        </div>
        <div class="nav-links">
            <a href="index.html">Roadmaps</a>
            <a href="forum.html">Fórum</a>
            <a href="preparacao.html">Preparação</a>
            <a href="glossario.html">Glossário</a>
            <a href="artigos.html">Artigos</a>
            <a href="contribuir.html">Contribuir</a>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class='bx bx-moon'></i>
        </button>
    </nav>

    <div class="container" style="display: block; max-width: 1000px;">
        <header style="text-align: center; margin-bottom: 30px; padding: 24px 0;">
            <section class="hero-section" style="border: none; padding: 0;">
                <h1>Publicações e Artigos</h1>
                <p>Explore conhecimentos sobre IA, Computação Quântica, Desenvolvimento e Carreira.</p>
            </section>
            <div style="margin-top: 20px; max-width: 600px; margin-left: auto; margin-right: auto;">
                <input type="text" id="article-search" placeholder="Pesquisar artigos..." style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--bg-light); color: var(--text-light);">
            </div>
        </header>

        <div id="article-display-area">
            <div id="article-grid" class="roadmap-grid">
                <!-- Article cards load here -->
            </div>
            <div id="pagination-controls" style="margin-top: 30px; display: flex; justify-content: center; gap: 10px; padding-bottom: 40px;">
                <!-- Pagination buttons load here -->
            </div>
        </div>

        <div id="article-view" style="display: none; padding: 0 20px;">
            <button class="btn btn-outline" onclick="backToList()" style="margin-bottom: 20px; display: flex; align-items: center; gap: 5px;">
                <i class='bx bx-left-arrow-alt'></i> Voltar para a lista
            </button>
            <div id="article-content">
                <!-- Full article content loads here -->
            </div>
        </div>
    </div>

    <script src="assets/functions.js"></script>
    <script src="assets/articles.js"></script>
    <script src="assets/tips.js"></script>
</body>
</html>
