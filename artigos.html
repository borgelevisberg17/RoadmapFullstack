    <meta property="og:url" content="https://roadmapfullstack.com/artigos.html">
    <meta property="og:title" content="Artigos e Publicações - RoadmapFullstack">

    <meta property="og:image" content="https://roadmapfullstack.com/assets/og-image.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://roadmapfullstack.com/artigos.html">
    <meta name="twitter:title" content="Artigos e Publicações - RoadmapFullstack">
    <meta name="twitter:description" content="Conhecimento técnico aprofundado, dicas de carreira, tutoriais e tendências do mundo da tecnologia para desenvolvedores de todos os níveis.">
    <meta name="twitter:image" content="https://roadmapfullstack.com/assets/og-image.png">

    <link href="assets/style.css" rel="stylesheet"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">
            <i class='bx bx-map-alt'></i> RoadmapFullstack
        </div>
        <div class="nav-links">
            <a href="index.html">Roadmaps</a>
            <a href="forum.html">Fórum</a>
            <a href="preparacao.html">Preparação</a>
            <a href="glossario.html">Glossário</a>
            <a href="artigos.html">Artigos</a>
            <a href="contribuir.html">Contribuir</a>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class='bx bx-moon'></i>
        </button>
    </nav>

    <div class="container">
        <aside class="sidebar">
            <h3>Navegação</h3>
            <ul>
                <li><a href="index.html" style="text-decoration: none; color: inherit;"><i class='bx bx-map'></i> Roadmaps</a></li>
                <li class="active"><a href="artigos.html" style="text-decoration: none; color: inherit;"><i class='bx bx-news'></i> Artigos</a></li>
                <li><a href="forum.html" style="text-decoration: none; color: inherit;"><i class='bx bx-question-mark'></i> Fórum</a></li>
            </ul>
        </aside>

        <main class="content-area" style="border-left: 1px solid var(--border-color); max-width: 100%;">
            <header class="hero-section" style="border: none; padding-bottom: 0;">
                <h1>Artigos e Publicações</h1>
                <p style="color: #6a737c;">Conhecimento aprofundado para sua carreira tech.</p>

                <div style="margin-top: 20px; position: relative;">
                    <i class='bx bx-search' style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6a737c;"></i>
                    <input type="text" id="article-search" placeholder="Pesquisar por título, autor ou conteúdo..." style="width: 100%; padding: 10px 10px 10px 35px; border: 1px solid var(--border-color); border-radius: 3px;">
                </div>
            </header>

            <div id="article-display-area">
                <div id="article-list" style="margin-top: 30px;">
                    <!-- Articles load here as a list -->
                </div>
                <div id="pagination-controls" style="margin-top: 30px; display: flex; justify-content: center; gap: 10px; padding-bottom: 40px;">
                    <!-- Pagination buttons -->
                </div>
            </div>

            <div id="article-view" style="display: none;">
                <button class="btn btn-outline" onclick="backToList()" style="margin-bottom: 20px; border: none; background: transparent; padding: 0; color: var(--link-color); display: flex; align-items: center; gap: 5px;">
                    <i class='bx bx-left-arrow-alt'></i> Voltar para a lista
                </button>
                <div id="article-content">
                    <!-- Full article content -->
                </div>
            </div>
        </main>

        <aside class="right-sidebar">
            <div class="s-widget">
                <div class="s-widget-header">Top Categorias</div>
                <div class="s-widget-content">
                    <div id="article-categories" class="question-tags">
                        <span class="tech-tag">JavaScript</span>
                        <span class="tech-tag">Carreira</span>
                        <span class="tech-tag">IA</span>
                        <span class="tech-tag">Arquitetura</span>
                        <span class="tech-tag">Git</span>
                    </div>
                </div>
            </div>

            <div id="related-questions-widget" class="s-widget" style="display: none;">
                <div class="s-widget-header">Perguntas Relacionadas</div>
                <div class="s-widget-content">
                    <ul id="related-questions-list" style="font-size: 0.85rem;">
                        <!-- Related questions from forum -->
                    </ul>
                </div>
            </div>

            <div class="s-widget">
                <div class="s-widget-header">Atividade do Fórum</div>
                <div class="s-widget-content">
                    <ul id="latest-activity-list" style="list-style: none;">
                        <!-- JS Loaded -->
                    </ul>
                </div>
            </div>
        </aside>
    </div>

    <script src="assets/functions.js"></script>
    <script src="assets/articles.js"></script>
    <script src="assets/tips.js"></script>
</body>
</html>
