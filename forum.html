<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórum Anônimo - RoadmapFullstack</title>
    <link href="assets/style.css" rel="stylesheet"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        .forum-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .question-card {
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
            background: var(--bg-light);
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            color: #6a737c;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }
        .question-title {
            font-size: 1.2rem;
            color: #0074cc;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }
        .answer-box {
            margin-left: 30px;
            border-left: 2px solid var(--border-color);
            padding-left: 15px;
            margin-top: 15px;
        }
        .answer {
            font-size: 0.9rem;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #f0f0f0;
        }
        .new-post-form {
            background: #fdf7e2;
            border: 1px solid #e6dbaf;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
        }
        [data-theme="dark"] .new-post-form {
            background: #3e3b2e;
            border-color: #5c553d;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background: var(--bg-light);
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <i class='bx bx-map-alt'></i> RoadmapFullstack
        </div>
        <div class="nav-links">
            <a href="index.html">Roadmaps</a>
            <a href="forum.html">Fórum</a>
            <a href="preparacao.html">Preparação</a>
            <a href="glossario.html">Glossário</a>
            <a href="artigos.html">Artigos</a>
            <a href="contribuir.html">Contribuir</a>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class='bx bx-moon'></i>
        </button>
    </nav>

    <div class="forum-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>Fórum de Dúvidas (Anônimo)</h1>
            <button class="btn" onclick="togglePostForm()">Fazer uma Pergunta</button>
        </header>

        <div id="post-form" class="new-post-form" style="display: none;">
            <h3>Nova Pergunta</h3>
            <div class="form-group">
                <label>Assunto / Título</label>
                <input type="text" id="post-title" placeholder="Ex: Como centralizar uma div?">
            </div>
            <div class="form-group">
                <label>Categoria</label>
                <select id="post-category" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 3px; background: var(--bg-light); color: var(--text-light);">
                    <option value="Dúvida Técnica">Dúvida Técnica</option>
                    <option value="Dica / Tutorial">Dica / Tutorial</option>
                    <option value="Carreira">Carreira</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <div class="form-group">
                <label>Sua dúvida em detalhes</label>
                <textarea id="post-content" rows="5"></textarea>
            </div>
            <button class="btn" onclick="submitPost()">Publicar Anônimo</button>
            <button class="btn btn-outline" onclick="togglePostForm()">Cancelar</button>
        </div>

        <div id="forum-posts">
            <!-- Posts load here -->
        </div>
    </div>

    <script src="assets/functions.js"></script>
    <script src="assets/forum.js"></script>
    <script src="assets/tips.js"></script>
</body>
</html>
