<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórum Anônimo - RoadmapFullstack</title>
    <link href="assets/style.css" rel="stylesheet"/>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">
            <i class='bx bx-map-alt'></i> RoadmapFullstack
        </div>
        <div class="nav-links">
            <a href="index.html">Roadmaps</a>
            <a href="forum.html">Fórum</a>
            <a href="preparacao.html">Preparação</a>
            <a href="glossario.html">Glossário</a>
            <a href="artigos.html">Artigos</a>
            <a href="contribuir.html">Contribuir</a>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class='bx bx-moon'></i>
        </button>
    </nav>

    <div class="forum-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>Fórum de Dúvidas (Anônimo)</h1>
            <button class="btn" onclick="togglePostForm()">Fazer uma Pergunta</button>
        </header>

        <div id="post-form" class="new-post-form" style="display: none;">
            <h3>Nova Pergunta</h3>
            <div class="form-group">
                <label>Assunto / Título</label>
                <input type="text" id="post-title" placeholder="Ex: Como centralizar uma div?">
            </div>
            <div class="form-group">
                <label>Categoria</label>
                <select id="post-category">
                    <option value="Dúvida Técnica">Dúvida Técnica</option>
                    <option value="Dica / Tutorial">Dica / Tutorial</option>
                    <option value="Carreira">Carreira</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <div class="form-group">
                <label>Sua dúvida em detalhes</label>
                <textarea id="post-content" rows="5"></textarea>
            </div>
            <button class="btn" onclick="submitPost()">Publicar Anônimo</button>
            <button class="btn btn-outline" onclick="togglePostForm()">Cancelar</button>
        </div>

        <div id="forum-posts">
            <!-- Posts load here -->
        </div>
    </div>

    <script src="assets/functions.js"></script>
    <script src="assets/forum.js"></script>
    <script src="assets/tips.js"></script>
</body>
</html>
